name: Pura X View 补货检查

on:
  schedule:
    # 每30分钟一次。注意两点:
    # 1. GitHub 对 schedule 有官方节流(高负载时段延迟几十分钟属正常), 实际间隔会大于30分钟;
    # 2. 私有仓库免费额度2000分钟/月, 配合下方缓存(单次约1分钟)月耗约1500分钟, 额度内。
    - cron: "*/30 * * * *"
  workflow_dispatch:          # 支持在 Actions 页面手动触发

permissions:
  contents: write             # 允许回写库存状态文件

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 缓存依赖(pip / npm / Playwright Chromium, 命中后单次运行约1分钟)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-v1

      - name: 安装依赖(playwright-core + Chromium, 用于华为商城库存接口)
        run: |
          pip install requests
          npm install playwright-core
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: 检查库存(有货时自动推送微信)
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python monitor.py --once

      - name: 回写库存状态(实现跨次运行的去重, 避免重复轰炸)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_state.json
          git diff --cached --quiet || git commit -m "chore: update stock state"
          git push
