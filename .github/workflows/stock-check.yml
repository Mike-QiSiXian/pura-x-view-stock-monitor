name: Pura X View 补货检查

on:
  schedule:
    # 仅作兜底: GitHub 自带 schedule 在私有/低活跃仓库上实测被节流到 2-4 小时一次,
    # 真正的 10 分钟频率由外部定时器(cron-job.org)调用 workflow_dispatch 接口驱动。
    - cron: "0 */6 * * *"
  workflow_dispatch:          # 外部定时器与手动触发都走这里

permissions:
  contents: read              # 不再回写仓库, 只读即可(状态走 Actions Cache)

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 缓存依赖(pip / npm / Playwright Chromium, 命中后单次运行约1分钟)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-v1

      - name: 安装依赖(playwright-core + Chromium, 用于华为商城库存接口)
        run: |
          pip install requests
          npm install playwright-core
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: 恢复库存状态缓存(跨次运行去重; 用 Cache 代替提交, 避免机器人提交刷屏仓库历史)
        uses: actions/cache/restore@v4
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: 检查库存(有货时自动推送微信)
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python monitor.py --once

      - name: 保存库存状态缓存(键含 run_id 每次唯一, 旧缓存 7 天未用自动淘汰)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}
